<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087CF0"/>
      <stop offset="100%" stop-color="#054FA0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="#102544"/>
  
  <!-- Back Card -->
  <rect x="76" y="110" width="360" height="230" rx="24" fill="#1B355A" stroke="#DFEAF7" stroke-width="2" transform="rotate(-6 256 225)" opacity="0.7"/>
  
  <!-- Front Card -->
  <g filter="url(#shadow)">
    <rect x="76" y="140" width="360" height="232" rx="24" fill="url(#bgGrad)" stroke="#DFEAF7" stroke-width="2"/>
    <!-- Chip -->
    <rect x="116" y="195" width="56" height="42" rx="8" fill="url(#goldGrad)"/>
    <path d="M116 216 h56 M144 195 v42 M130 195 v42 M158 195 v42" stroke="#8A6B0A" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Contactless wave -->
    <path d="M195 204 A16 16 0 0 1 195 228" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M205 198 A26 26 0 0 1 205 234" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <!-- Brand Wordmark -->
    <text x="390" y="185" text-anchor="end" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="2">DREAD DYN</text>
    <!-- Card Number Dots -->
    <text x="116" y="295" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="4">••••  ••••  ••••  8829</text>
    <text x="116" y="335" fill="#DFEAF7" font-family="system-ui, sans-serif" font-size="12" letter-spacing="1.5" text-transform="uppercase">PREMIUM STORE</text>
    <text x="388" y="335" text-anchor="end" fill="#DFEAF7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">EXP 12/29</text>
  </g>
</svg>
